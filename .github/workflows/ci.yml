name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ts-orchestrator:
    name: Build, Lint & Test TypeScript Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint and typecheck
        run: npm run lint
      - name: Build artifact
        run: npm run build
      - name: Run unit, resilience & benchmark tests
        run: npm test
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high || true
      - name: Install and smoke test built artifact
        run: npm pack --dry-run

  py-evidence-worker:
    name: Test Python Semantic Worker & Search Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Python unit tests
        run: python -m unittest discover -s python_worker -p "test_*.py" -v
      - name: Smoke test semantic search engine import
        run: python -c "from python_worker.semantic_search_engine import SemanticChunker, DenseEmbeddingIndex; print('Smoke test OK')"

  security-scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
